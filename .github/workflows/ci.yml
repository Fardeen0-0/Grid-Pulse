# CI for GridPulse.
#
# The application is a FastAPI backend in backend/ and a Next.js frontend in
# frontend/. Jobs run on every push to main and every pull request that
# targets main.
#
# Frontend: Node.js and npm are pinned, dependencies install from
# frontend/package-lock.json with npm ci, lint / typecheck / test run when
# frontend/package.json defines those scripts, and the Next.js production
# build always runs.
#
# Backend: Python and pip are pinned, dependencies install from
# backend/requirements.txt, and Ruff or pytest run when the repo defines
# them. On a push to main, python backend/verify_all.py exercises Tiger Data,
# MongoDB Atlas, Gemini, and Solana Devnet. Pull requests skip that step
# because fork PRs do not receive Actions secrets.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Node 22.23.5 ships npm 10.9.9. Reinstall that exact release so the
      # package manager does not float with the runner image.
      - name: Pin npm and install dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install -g npm@10.9.9
          npm --version
          npm ci

      - name: Lint, typecheck, and test
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          run_if_present() {
            local name="$1"
            local raw
            raw="$(npm pkg get "scripts.${name}")"
            # npm prints {} when the key is absent and "" when the script is empty.
            if [[ "$raw" == "undefined" || "$raw" == "{}" || "$raw" == '""' ]]; then
              echo "No \"${name}\" script; skipping"
              return 0
            fi
            if [[ "$name" == "test" && "$raw" == *"no test specified"* ]]; then
              echo "npm test is still the generated placeholder; skipping"
              return 0
            fi
            echo "Running npm run ${name}"
            npm run "${name}"
          }
          run_if_present lint
          run_if_present typecheck
          run_if_present test

      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.12.16
          pip-version: "26.3"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Lint and test
        shell: bash
        run: |
          set -euo pipefail

          has_ruff_config=false
          if [[ -f ruff.toml || -f .ruff.toml || -f backend/ruff.toml || -f backend/.ruff.toml ]]; then
            has_ruff_config=true
          elif [[ -f pyproject.toml ]] && grep -Eq '^\[tool\.ruff' pyproject.toml; then
            has_ruff_config=true
          elif [[ -f backend/pyproject.toml ]] && grep -Eq '^\[tool\.ruff' backend/pyproject.toml; then
            has_ruff_config=true
          fi

          if [[ "$has_ruff_config" == true ]]; then
            python -m pip install ruff==0.17.5
            ruff check backend
          else
            echo "No Ruff config; skipping backend lint"
          fi

          has_tests=false
          if [[ -f pytest.ini || -f backend/pytest.ini || -d tests || -d test || -d backend/tests ]]; then
            has_tests=true
          elif [[ -f pyproject.toml ]] && grep -Eq '^\[tool\.pytest' pyproject.toml; then
            has_tests=true
          elif [[ -f backend/pyproject.toml ]] && grep -Eq '^\[tool\.pytest' backend/pyproject.toml; then
            has_tests=true
          elif find backend -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            has_tests=true
          fi

          if [[ "$has_tests" == true ]]; then
            python -m pip install pytest==9.2.0
            python -m pytest backend
          else
            echo "No pytest setup; skipping backend tests"
          fi

      # Fork pull requests do not receive secrets. Run the live sponsor check
      # only on push to main, and fail with the missing secret names when the
      # repository has not been configured yet.
      - name: Verify sponsor integrations
        if: github.event_name == 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIGER_POSTGRES_URL: ${{ secrets.TIGER_POSTGRES_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          PUBLIC_DOMAIN: ${{ secrets.PUBLIC_DOMAIN }}
        run: |
          set -euo pipefail
          missing=()
          for name in GEMINI_API_KEY TIGER_POSTGRES_URL MONGODB_URI SOLANA_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          python backend/verify_all.py
